<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <link rel="stylesheet" href="scripts/base.css">
</head>
<body>
 		<div class="header-container">
		<!-- Horizontal Ticker Tape -->

		</div>
		<div class="header-container">
			<a class="weatherwidget-io" href="https://forecast7.com/en/33d15n96d82/frisco/" data-label_1="FRISCO" data-label_2="WEATHER" data-theme="original" >FRISCO, TX WEATHER</a>
			<script>
!function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
</script>
		<a class="weatherwidget-io" href="https://forecast7.com/en/33d15n96d82/frisco/?unit=us" data-label_1="FRISCO" data-label_2="WEATHER" data-icons="Climacons Animated" data-theme="weather_one" >FRISCO WEATHER</a>
		<script>
			!function(d,s,id){
			var js,fjs=d.getElementsByTagName(s)[0];
			if(!d.getElementById(id)){js=d.createElement(s);
			js.id=id;
			js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);
			}
			}
			(document,'script','weatherwidget-io-js');
		</script>
		</div>
<div class="slideshow-container">

    <!-- Slide 1 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Landscape 1">
    </div>

    <!-- Slide 3 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Landscape 2">
    </div>

    <!-- Slide 5 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Landscape 3">
    </div>

    <!-- Slide 7 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1785842762328-82ee8fe9d8c3?&auto=format&fit=crop&w=1600&q=80" alt="Landscape 4">
    </div>

    <!-- Slide 9 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1785921257672-e4b8bc2fd63b?&auto=format&fit=crop&w=1600&q=80" alt="Landscape 5">
    </div>

    <!-- Slide 11 -->
    <div class="mySlides fade">
        <img src="https://images.unsplash.com/photo-1785948448073-af10f8938602?&auto=format&fit=crop&w=1600&q=80" alt="Landscape 6">
    </div>

    <!-- Navigation Arrows -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Navigation Dots -->
    <div class="dots-container">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
        <span class="dot" onclick="currentSlide(5)"></span>
        <span class="dot" onclick="currentSlide(6)"></span>
        </div>
</div>

<script src="scripts/base.js"></script>

</body>
</html>
