<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Pro Sports Scoreboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9f43;
            --border-glow: #2c3e50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .scoreboard-card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
            border: 1px solid #333;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        select {
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }

        .game-status {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .match-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .team-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .team-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 600;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .divider {
            font-size: 1.5rem;
            color: #555;
            font-weight: 300;
        }

        .info-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="scoreboard-card">
    <div class="controls-row">
        <!-- League Selector Dropdown -->
        <select id="league-select" onchange="fetchScores()">
            <option value="mlb">MLB Baseball</option>
            <option value="nba">NBA Basketball</option>
            <option value="nfl">NFL Football</option>
            <option value="nhl">NHL Hockey</option>
        </select>
        <div class="game-status" id="game-status">LOADING...</div>
    </div>
    
    <div class="match-container">
        <!-- Away Team -->
        <div class="team-block">
            <img id="away-logo" class="team-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org>" alt="Away Logo">
            <div id="away-name" class="team-name">Away Team</div>
        </div>
        
        <div id="away-score" class="score-display">0</div>
        <div class="divider">VS</div>
        <div id="home-score" class="score-display">0</div>

        <!-- Home Team -->
        <div class="team-block">
            <img id="home-logo" class="team-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org>" alt="Home Logo">
            <div id="home-name" class="team-name">Home Team</div>
        </div>
    </div>

    <div class="info-footer" id="game-detail">Fetching live match info...</div>
</div>

<script>
    // Configuration Object: Define exactly which Pro Team you want to lock on to per League
    // Use official team abbreviations (e.g., "NYY", "LAL", "DAL", "BOS")
    const targetTeams = {
        mlb: "NYY",  // New York Yankees
        nba: "LAL",  // Los Angeles Lakers
        nfl: "DAL",  // Dallas Cowboys
        nhl: "BOS"   // Boston Bruins
    };

    async function fetchScores() {
        const league = document.getElementById('league-select').value;
        const targetAbbreviation = targetTeams[league];
        
        // Dynamic construction using ESPN public endpoint framework
        let url = `https://espn.com`;
        if (league === 'nba') url = `https://espn.com`;
        if (league === 'nfl') url = `https://espn.com`;
        if (league === 'nhl') url = `https://espn.com`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            // Loop array to isolate specific configured team
            const targetGame = data.events.find(event => {
                return event.competitions[0].competitors.some(team => team.team.abbreviation === targetAbbreviation);
            });

            if (!targetGame) {
                document.getElementById('game-status').innerText = "NO GAME";
                document.getElementById('game-detail').innerText = `No game scheduled today for ${targetAbbreviation}.`;
                return;
            }

            const comp = targetGame.competitions[0];
            const homeTeamData = comp.competitors.find(t => t.side === 'home');
            const awayTeamData = comp.competitors.find(t => t.side === 'away');

            // Map variables directly to UI Elements
            document.getElementById('home-name').innerText = homeTeamData.team.shortDisplayName.toUpperCase();
            document.getElementById('home-logo').src = homeTeamData.team.logo;
            document.getElementById('home-score').innerText = homeTeamData.score;

            document.getElementById('away-name').innerText = awayTeamData.team.shortDisplayName.toUpperCase();
            document.getElementById('away-logo').src = awayTeamData.team.logo;
            document.getElementById('away-score').innerText = awayTeamData.score;

            // Set Clock or State (Live, Final, Scheduled time)
            document.getElementById('game-status').innerText = targetGame.status.type.detail;
            document.getElementById('game-detail').innerText = comp.venue ? comp.venue.fullName : "";

        } catch (error) {
            console.error("Scoreboard API Network Error:", error);
            document.getElementById('game-status').innerText = "ERROR";
            document.getElementById('game-detail').innerText = "Unable to process live data feed.";
        }
    }

    // Initialize display on initial script execution
    fetchScores();

    // Auto-refresh interval (queries ESPN every 30 seconds for real-time tracking)
    setInterval(fetchScores, 30000);
</script>

</body>
</html>
