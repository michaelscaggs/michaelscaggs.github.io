<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS-Fixed Pro Sports Scoreboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9f43;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .scoreboard-card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 95%;
            max-width: 480px;
            border: 1px solid #333;
            box-sizing: border-box;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        select {
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .game-status {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-color);
            text-align: right;
            max-width: 50%;
        }

        .match-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
        }

        .team-name {
            font-size: 1rem;
            font-weight: 600;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: 800;
            min-width: 60px;
            text-align: center;
        }

        .divider {
            font-size: 1.2rem;
            color: #555;
        }

        .info-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="scoreboard-card">
    <div class="controls-row">
        <select id="league-select" onchange="fetchScores()">
            <option value="mlb">MLB Baseball</option>
            <option value="nba">NBA Basketball</option>
            <option value="nfl">NFL Football</option>
            <option value="nhl">NHL Hockey</option>
        </select>
        <div class="game-status" id="game-status">FETCHING...</div>
    </div>
    
    <div class="match-container">
        <!-- Away -->
        <div class="team-block">
            <img id="away-logo" class="team-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org>" alt="Away">
            <div id="away-name" class="team-name">Away Team</div>
        </div>
        
        <div id="away-score" class="score-display">-</div>
        <div class="divider">@</div>
        <div id="home-score" class="score-display">-</div>

        <!-- Home -->
        <div class="team-block">
            <img id="home-logo" class="team-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org>" alt="Home">
            <div id="home-name" class="team-name">Home Team</div>
        </div>
    </div>

    <div class="info-footer" id="game-detail">Loading data tunnel...</div>
</div>

<script>
    // Configuration Object: Define exactly which Pro Team you want to lock on to per League
    // Use official team abbreviations (e.g., "NYY", "LAL", "DAL", "BOS")
    const targetTeams = {
        mlb: "ATH",  // New York Yankees
        mlb: "DET",  // Detroit Tigers
        mlb: "CHC",  // Chicago Cubs
        nba: "LAL",  // Los Angeles Lakers
        nba: "DET",  // Detroit Pistons
        nba: "ORL",  // Orlando Magic
        nfl: "LV",  // Las Vegas Raiders
        nfl: "GB",  // Green Bay Packers
        nfl: "DET",  // Detroit Lions
        nhl: "PIT",  // Pittsburgh Penguins
        nhl: "DET",  // Detroit Red Wings
        nhl: "VGK"  // Las Vegas Golden Knights
    };

    async function fetchScores() {
        const league = document.getElementById('league-select').value;
        const targetAbbreviation = targetTeams[league];
        
        document.getElementById('game-status').innerText = "REFRESHING...";

        let rawUrl = `https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard`;
        if (league === 'nba') rawUrl = `https://espn.com`;
        if (league === 'nfl') rawUrl = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard`;
        if (league === 'nhl') rawUrl = `https://espn.com`;

        // Bypassing CORS constraints using allorigins public proxy
        let proxyUrl = `https://allorigins.win{encodeURIComponent(rawUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Proxy connection down");
            
            const wrapper = await response.json();
            const data = JSON.parse(wrapper.contents); // Extract string payload parsed into JSON

            if (!data.events || data.events.length === 0) {
                showNoGame(targetAbbreviation);
                return;
            }
            
            // Search the event array for matches containing the configured team abbreviation
            const targetGame = data.events.find(event => {
                return event.competitions[0].competitors.some(c => c.team.abbreviation === targetAbbreviation);
            });

            if (!targetGame) {
                showNoGame(targetAbbreviation);
                return;
            }

            const comp = targetGame.competitions[0];
            const homeTeamData = comp.competitors.find(t => t.side === 'home');
            const awayTeamData = comp.competitors.find(t => t.side === 'away');

            // Render UI
            document.getElementById('home-name').innerText = homeTeamData.team.abbreviation;
            document.getElementById('home-logo').src = homeTeamData.team.logo || "";
            document.getElementById('home-score').innerText = homeTeamData.score;

            document.getElementById('away-name').innerText = awayTeamData.team.abbreviation;
            document.getElementById('away-logo').src = awayTeamData.team.logo || "";
            document.getElementById('away-score').innerText = awayTeamData.score;

            document.getElementById('game-status').innerText = targetGame.status.type.detail;
            document.getElementById('game-detail').innerText = comp.venue ? comp.venue.fullName : "Pro League Venue";

        } catch (error) {
            console.error("Scoreboard Failure:", error);
            document.getElementById('game-status').innerText = "CORS ERROR";
            document.getElementById('game-detail').innerText = "Data stream failed via proxy tunnel.";
        }
    }

    function showNoGame(teamAbbr) {
        document.getElementById('game-status').innerText = "OFF AIR";
        document.getElementById('home-score').innerText = "-";
        document.getElementById('away-score').innerText = "-";
        document.getElementById('game-detail').innerText = `No live game found today for team [${teamAbbr}].`;
    }

    // Run immediately and handle regular 60-second updates
    fetchScores();
    setInterval(fetchScores, 60000);
</script>

</body>
</html>
