        <script>
            function updateClocks() {
                const now = new Date();

                document.getElementById("utc").textContent = now.toUTCString().split(' ')[4];
                document.getElementById("est").textContent = now.toLocaleTimeString("en-US", { timeZone: "America/New_York" });
                document.getElementById("cst").textContent = now.toLocaleTimeString("en-US", { timeZone: "America/Chicago" });
                document.getElementById("mst").textContent = now.toLocaleTimeString("en-US", { timeZone: "America/Denver" });
                document.getElementById("ast").textContent = now.toLocaleTimeString("en-US", { timeZone: "America/Phoenix" });
                document.getElementById("pst").textContent = now.toLocaleTimeString("en-US", { timeZone: "America/Los_Angeles" });
                document.getElementById("hst").textContent = now.toLocaleTimeString("en-US", { timeZone: "Pacific/Honolulu" });
            }

            // Update every second
            setInterval(updateClocks, 1000);
            updateClocks(); // Initial call
        </script>

 // 1. Define your RSS feed URL. 
    // Note: If you face CORS issues, use an open proxy like: https://herokuapp.com
    const rssUrl = 'https://www.espn.com/espn/rss/news'; 

    async function loadRssIntoIframe() {
        try {
            const response = await fetch(rssUrl);
            const text = await response.text();
            
            // 2. Parse the text into XML
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const items = xmlDoc.querySelectorAll("item");

            // 3. Build the HTML string that will live inside the iframe
            let iframeContent = `
                <html>
                <head>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 15px; color: #333; line-height: 1.5; }
                        .post { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
                        .post a { color: #0066cc; text-decoration: none; font-weight: bold; font-size: 18px; }
                        .post a:hover { text-decoration: underline; }
                        .date { color: #777; font-size: 12px; margin: 4px 0; }
                        .desc { font-size: 14px; margin-top: 5px; }
                    </style>
                </head>
                <body>
            `;

            // 4. Loop through the XML items and convert them to HTML elements
            items.forEach(item => {
                const title = item.querySelector("title")?.textContent || "No Title";
                const link = item.querySelector("link")?.textContent || "#";
                const pubDate = item.querySelector("pubDate")?.textContent || "";
                const description = item.querySelector("description")?.textContent || "";

                iframeContent += `
                    <div class="post">
                        <a href="${link}" target="_blank">${title}</a>
                        <div class="date">${pubDate}</div>
                        <div class="desc">${description}</div>
                    </div>
                `;
            });

            iframeContent += `</body></html>`;

            // 5. Inject the generated HTML into the iframe via srcdoc
            document.getElementById('rss-iframe').srcdoc = iframeContent;

        } catch (error) {
            console.error("Error fetching or parsing the RSS feed:", error);
            document.getElementById('rss-iframe').srcdoc = "<html><body><p>Failed to load feed content.</p></body></html>";
        }
    }

    // Run the function when the page loads
    loadRssIntoIframe();
	</script>
